name: Privacy gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy:
    name: Private content
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan files and complete history
        env:
          PRIVATE_CONTENT_TERMS_JSON: ${{ secrets.PRIVATE_CONTENT_TERMS_JSON }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/check_private_content.py --history --require-private-terms
      - name: Run regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s tests -v
